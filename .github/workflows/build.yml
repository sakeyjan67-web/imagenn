name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK and Build
      run: |
        echo "Setting up Android SDK..."
        mkdir -p $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d temp_tools
        mv temp_tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        rm -rf cmdline-tools.zip temp_tools
        
        # Path set karo
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=\(PATH:\)ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # Licenses accept karo
        yes | sdkmanager --licenses || true
        
        # Tools aur Platforms install karo
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        
        # Gradle execute permission
        chmod +x gradlew
        
        # APK Build karo
        ./gradlew assembleDebug
