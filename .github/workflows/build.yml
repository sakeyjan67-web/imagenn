name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Setup Android SDK
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip -d android_temp
        mv android_temp/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        rm -rf tools.zip android_temp

        echo "ANDROID_HOME=\(HOME/android-sdk" >>\)GITHUB_ENV
        echo "\(HOME/android-sdk/cmdline-tools/latest/bin" >>\)GITHUB_PATH
        echo "\(HOME/android-sdk/platform-tools" >>\)GITHUB_PATH

    - name: Accept Licenses and Install Tools
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=\(PATH:\)ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug
