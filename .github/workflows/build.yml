name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK and Build
      env:
        ANDROID_SDK_ROOT: /home/runner/android-sdk
        CMDLINE_TOOLS_VERSION: "11076708"
      run: |
        echo "Creating SDK directory..."
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        
        echo "Downloading command-line tools..."
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip -O cmdline-tools.zip
        
        echo "Extracting tools..."
        unzip -q cmdline-tools.zip -d temp_tools
        mv temp_tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
        rm -rf cmdline-tools.zip temp_tools

        # Add tools to path for the rest of the steps
        echo "\(ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >>\)GITHUB_PATH
        echo "\(ANDROID_SDK_ROOT/platform-tools" >>\)GITHUB_PATH
        
        export PATH=\(PATH:\)ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools

        echo "Accepting licenses..."
        yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true

        echo "Installing required components..."
        sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

        echo "Granting gradlew permission..."
        chmod +x gradlew

        echo "Building debug APK..."
        ./gradlew assembleDebug
