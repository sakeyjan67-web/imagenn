name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK, Licenses, and Build APK
      run: |
        echo "Setting up Android SDK..."
        mkdir -p $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip -d android_temp
        mv android_temp/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        rm -rf tools.zip android_temp

        # Export paths for this session
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=\(PATH:\)ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

        echo "Accepting licenses..."
        yes | sdkmanager --licenses || true

        echo "Installing build tools and platforms..."
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

        echo "Making gradlew executable..."
        chmod +x gradlew

        echo "Building APK..."
        ./gradlew assembleDebug
