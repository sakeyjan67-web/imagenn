name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK manually
      run: |
        echo "Setting up Android SDK..."
        mkdir -p $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d temp_tools
        mv temp_tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        rm -rf cmdline-tools.zip temp_tools
        
        # Set Environment Variables
        echo "ANDROID_HOME=\(HOME/android-sdk" >>\)GITHUB_ENV
        echo "\(HOME/android-sdk/cmdline-tools/latest/bin" >>\)GITHUB_PATH
        echo "\(HOME/android-sdk/platform-tools" >>\)GITHUB_PATH

    - name: Accept Android Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Install Build Tools and Platforms
      run: |
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug
