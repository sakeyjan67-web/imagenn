workflows:
  android-workflow:
    name: Android Debug Build
    max_build_duration: 30
    environment:
      android_signing:
        - keystore_reference
      groups:
        - credentials
    scripts:
      - name: Grant execute permission for gradlew
        script: |
          chmod +x gradlew
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - build/outputs/apk/debug/*.apk
