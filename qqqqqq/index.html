      document.querySelectorAll(".trend-row").forEach(button=>button.addEventListener("click",()=>{document.getElementById("searchInput").value=button.dataset.trend;query=button.dataset.trend;current=0;renderClip();}));
    }
    function next(direction=1) { const items=visibleClips(); if(!items.length) return; current=(current+direction+items.length)%items.length; renderClip(); }
    async function shareClip() {
      const clip=visibleClips()[current]; if(!clip)return;
      const data={title:`CamTok · @${clip.user}`,text:clip.caption,url:location.href};
      try { if(navigator.share) await navigator.share(data); else if(navigator.clipboard) { await navigator.clipboard.writeText(location.href); showToast("Link copied to your clipboard"); } else showToast("Your video is ready to share"); } catch(error) { if(error.name!=="AbortError") showToast("Your video is ready to share"); }
    }
    const modal=document.getElementById("uploadModal");
    const cameraState = { stream: null, recorder: null, chunks: [], file: null, previewUrl: null };
    const uploadCamera = document.createElement("section");
    uploadCamera.className = "camera-tools";
    uploadCamera.innerHTML = '<div class="camera-actions"><button type="button" class="primary" id="enableCamera">Record with camera</button><button type="button" id="startRecording" hidden>Start recording</button><button type="button" id="stopRecording" hidden>Stop recording</button><button type="button" id="stopCamera" hidden>Turn camera off</button></div><video class="camera-preview" id="cameraPreview" autoplay muted playsinline hidden></video><p class="camera-hint" id="cameraStatus">Camera access needs your permission. Recording stays on this device until you save it to your library.</p>';
    document.getElementById("dropzone").insertAdjacentElement("afterend", uploadCamera);
    const cameraPreview = document.getElementById("cameraPreview");
    function stopCameraStream(videoElement = cameraPreview) {
      cameraState.stream?.getTracks().forEach(track => track.stop());
      cameraState.stream = null;
      videoElement.srcObject = null;
      document.getElementById("stopCamera").hidden = true;
      document.getElementById("startRecording").hidden = true;
    }
    async function startCameraPreview(videoElement = cameraPreview) {
      if (!navigator.mediaDevices?.getUserMedia) {
        showToast("Camera needs HTTPS or localhost in a supported browser");
        return false;
      }
      try {
        stopCameraStream(videoElement);
        cameraState.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1080 }, height: { ideal: 1920 } }, audio: true });
        videoElement.srcObject = cameraState.stream;
        videoElement.hidden = false;
        await videoElement.play();
        document.getElementById("stopCamera").hidden = false;
        document.getElementById("cameraStatus").textContent = "Camera preview is on. Your camera is not being broadcast.";
        return true;
      } catch (error) {
        stopCameraStream();
        showToast(error.name === "NotAllowedError" ? "Allow camera and microphone access to record" : "Camera could not start on this device");
        return false;
      }
    }
    function clearRecordedPreview() {
      if (cameraState.previewUrl) URL.revokeObjectURL(cameraState.previewUrl);
      cameraState.previewUrl = null;
      cameraState.file = null;
    }
    document.getElementById("enableCamera").addEventListener("click", async () => {
      if (await startCameraPreview()) document.getElementById("startRecording").hidden = false;
    });
    document.getElementById("startRecording").addEventListener("click", () => {
      if (!cameraState.stream || !window.MediaRecorder) { showToast("Video recording is not supported in this browser"); return; }
      clearRecordedPreview();
      cameraState.chunks = [];
      const mimeType = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find(type => MediaRecorder.isTypeSupported(type));
      try {
        cameraState.recorder = new MediaRecorder(cameraState.stream, mimeType ? { mimeType } : undefined);
        cameraState.recorder.ondataavailable = event => { if (event.data.size) cameraState.chunks.push(event.data); };
        cameraState.recorder.onstop = () => {
          const blob = new Blob(cameraState.chunks, { type: cameraState.recorder.mimeType || "video/webm" });
          if (!blob.size || blob.size > 100 * 1024 * 1024) { showToast("Recording is empty or larger than 100 MB"); return; }
          cameraState.file = new File([blob], `camtok-${Date.now()}.webm`, { type: blob.type });
          cameraState.previewUrl = URL.createObjectURL(blob);
          cameraPreview.srcObject = null;
          cameraPreview.src = cameraState.previewUrl;
          cameraPreview.controls = true;
          document.getElementById("cameraStatus").textContent = "Recording ready. Add a caption, then save it to your on-device library.";
          document.getElementById("startRecording").hidden = false;
          document.getElementById("stopRecording").hidden = true;
        };
        cameraState.recorder.start(500);
        document.getElementById("cameraStatus").innerHTML = '<span class="recording-dot"></span>Recording on this device';
        document.getElementById("startRecording").hidden = true;
        document.getElementById("stopRecording").hidden = false;
      } catch {
        showToast("Camera recording could not start");
      }
    });
    document.getElementById("stopRecording").addEventListener("click", () => {
      if (cameraState.recorder?.state === "recording") cameraState.recorder.stop();
    });
    document.getElementById("stopCamera").addEventListener("click", stopCameraStream);
    function openUpload(){modal.classList.add("open");document.getElementById("videoFile").focus();}
    function closeUpload(){modal.classList.remove("open");if(cameraState.recorder?.state==="recording")cameraState.recorder.stop();stopCameraStream();}
    document.querySelectorAll("[data-upload]").forEach(button=>button.addEventListener("click",openUpload));
    document.getElementById("closeModal").addEventListener("click",closeUpload);
    modal.addEventListener("click",event=>{if(event.target===modal)closeUpload();});
    const commentsModal=document.getElementById("commentsModal");
    document.getElementById("closeComments").addEventListener("click",closeComments);
    commentsModal.addEventListener("click",event=>{if(event.target===commentsModal)closeComments();});
    document.getElementById("clipCommentForm").addEventListener("submit",event=>{
      event.preventDefault();
      const clip=allClips().find(item=>item.id===commentsModal.dataset.clipId);
      const input=document.getElementById("clipCommentInput");
      if(!clip||!input.value.trim())return;
      if(!postClipComment(clip,input.value))return;
      input.value="";
      renderClip();
      openComments(clip);
      showToast("Comment saved on this device");
    });
    document.getElementById("viewComments").addEventListener("click",()=>openComments());
    document.getElementById("videoFile").addEventListener("change",event=>{
      const file=event.target.files[0]; const zone=document.getElementById("dropzone");
      if(!file)return;
      if(file.size>100*1024*1024){showToast("That video's a little too large. Try one under 100 MB.");event.target.value="";return;}
      if(cameraState.recorder?.state==="recording")cameraState.recorder.stop();
      clearRecordedPreview();
      stopCameraStream();
      zone.classList.add("has-file"); zone.innerHTML=`<video src="${URL.createObjectURL(file)}" controls muted></video>`;
    });
    document.getElementById("uploadForm").addEventListener("submit",async event=>{
      event.preventDefault();const file=document.getElementById("videoFile").files[0]||cameraState.file;
      if(!file){showToast("Choose a video first, then your caption is ready to go.");return;}
      const videoUrl=URL.createObjectURL(file);const caption=document.getElementById("captionInput").value.trim()||"a little something from today";const topic=(document.getElementById("tagInput").value.trim().replace(/^#/,"")||"yourday");
      const clip={id:`upload-${Date.now()}`,user:"you",name:"Your profile",avatar:"photo-1534528741775-53994a69daeb",cover:"photo-1519608487953-e999c86e7455",caption,tags:[topic],music:"original sound · you",likes:0,comments:0,topic:"your post",videoUrl,uploaded:true};
      let stored=false;
      try { await repository.saveClip(clip,file);stored=true; } catch { showToast("Clip added for this visit; device storage was unavailable"); }
      customClips.unshift(clip);
      stopCameraStream();
      clearRecordedPreview();
        current=0;filter="For you";query="";document.getElementById("searchInput").value="";closeUpload();event.target.reset();const zone=document.getElementById("dropzone");zone.classList.remove("has-file");zone.innerHTML=`<svg class="icon"><use href="#i-upload"/></svg><strong>Choose a video to post</strong><span>Saved privately on this device · up to 100 MB</span>`;showPage("Feed");if(stored)showToast("Video saved to your on-device library");
    });
    function setFilter(value){filter=value;current=0;query="";document.getElementById("searchInput").value="";showPage("Feed");}
    function syncNav(){document.querySelectorAll(".nav-item").forEach(item=>{const isActive=item.dataset.page?activeView===item.dataset.page:activeView==="Feed"&&item.dataset.filter===filter;item.classList.toggle("active",isActive);});document.querySelectorAll(".bottom-nav button[data-page]").forEach(item=>item.classList.toggle("active",item.dataset.page===activeView));document.getElementById("forYouTab").classList.toggle("active",activeView==="Feed"&&filter!=="Following");document.getElementById("followingTab").classList.toggle("active",activeView==="Feed"&&filter==="Following");}
    document.querySelectorAll("[data-filter]").forEach(button=>button.addEventListener("click",()=>setFilter(button.dataset.filter)));
    document.querySelectorAll("[data-page]").forEach(button=>button.addEventListener("click",()=>button.dataset.page==="Feed"?setFilter("For you"):showPage(button.dataset.page)));
    document.getElementById("forYouTab").addEventListener("click",()=>setFilter("For you"));
    document.getElementById("followingTab").addEventListener("click",()=>setFilter("Following"));
    document.getElementById("previousClip").addEventListener("click",()=>next(-1));
    document.getElementById("nextClip").addEventListener("click",()=>next(1));
    document.getElementById("searchInput").addEventListener("input",event=>{if(activeView!=="Feed")showPage("Feed");query=event.target.value.trim();current=0;renderClip();});
    document.getElementById("filterButton").addEventListener("click",()=>{const options=["For you","Explore","Following","Saved"];const nextFilter=options[(options.indexOf(filter)+1)%options.length];setFilter(nextFilter);showToast(`Showing ${nextFilter.toLowerCase()}`);});
    document.getElementById("gridButton").addEventListener("click",()=>showToast("You're in the full-screen video view"));
    document.getElementById("inboxButton").addEventListener("click",()=>showPage("Inbox"));
    document.getElementById("profileButton").addEventListener("click",()=>showPage("Profile"));
    document.querySelector(".brand").addEventListener("click",event=>{event.preventDefault();setFilter("For you");});
    document.getElementById("seeLive").addEventListener("click",()=>showPage("LIVE"));
    document.getElementById("refreshTrends").addEventListener("click",()=>{trends.push(trends.shift());renderTrends();});
    document.getElementById("commentForm").addEventListener("submit",event=>{event.preventDefault();const clip=currentClip();const input=document.getElementById("commentInput");if(!clip||!input.value.trim()||!postClipComment(clip,input.value))return;input.value="";renderClip();showToast("Comment saved on this device");});
    document.addEventListener("keydown",event=>{if(event.key==="Escape"){closeUpload();closeComments();}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="k"){event.preventDefault();document.getElementById("searchInput").focus();return;}if(event.target.matches("input,textarea"))return;if(activeView==="Feed"&&(event.key==="ArrowDown"||event.key==="j")){event.preventDefault();next(1);}if(activeView==="Feed"&&(event.key==="ArrowUp"||event.key==="k")){event.preventDefault();next(-1);}if(event.key==="c"){event.preventDefault();openUpload();}});
    let touchStart=0;
    document.getElementById("stage").addEventListener("touchstart",event=>{touchStart=event.changedTouches[0].screenY;},{passive:true});
    document.getElementById("stage").addEventListener("touchend",event=>{const distance=touchStart-event.changedTouches[0].screenY;if(Math.abs(distance)>45)next(distance>0?1:-1);},{passive:true});
    void persistReactions();
    renderStories();renderFollowList();renderTrends();renderClip();restoreUploadedClips();
    })();
  </script>
</body>
</html>
